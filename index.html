g)"><div class="container py-5" style="max-width:1200px"><h1 class="text-center mb-2"><span class="title-p1">HK </span><span class="title-p2">Galaxy </span><span class="title-p3">Gene</span><span class="title-p4">rator</span></h1><p class="text-center text-secondary" style="font-size:1.2rem">Create your HK galaxy boards &dash; made by <strong>Teppi</strong> and <strong>Ff300</strong>.<br>Make sure to check the <a href="credits.html">credits</a> :)</p><div class="row g-4 mt-1"><div class="col-12 col-md-5"><div class="border rounded p-4 h-100"><h5 class="mb-4">Settings</h5><form id="settingsForm"><div class="row g-3 mb-3"><div class="col-5"><label for="inputPlayerCount" class="form-label medium">Player count</label> <input type="number" id="inputPlayerCount" class="form-control form-control-m" value="4"/><div id="inputPlayerCountValidation" class="invalid-feedback d-none">Must be between 1 and 4.</div></div><div class="col-7"><label for="inputSeed" class="form-label medium">Seed</label> <input id="inputSeed" class="form-control form-control-m" aria-describedby="inputSeedHelp" value="Teppi fishes"/><div id="inputSeedHelp" class="form-text" style="font-size:1rem">Any random string or number.</div></div><div class="col-12"><label for="inputCenterSquare" class="form-label medium">Center square</label> <select class="form-select form-select-m" id="inputCenterSquare" aria-label="Center square"><option value="#Random" selected="selected">Random</option></select></div></div><hr class="my-3"/><p class="medium fw-semibold mb-2" style="letter-spacing:.05em">Options</p><div class="row row-cols-2 g-2 mb-3"><div class="col"><div class="form-check"><input type="checkbox" id="inputGeoLimit" class="form-check-input"/> <label for="inputGeoLimit" class="form-check-label small">Geo limitations</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputMajorAbility" class="form-check-input"/> <label for="inputMajorAbility" class="form-check-label small">Major ability chance</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputTollLimit" class="form-check-input"/> <label for="inputTollLimit" class="form-check-label small">Toll limitations</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputMultipleSaves" class="form-check-input"/> <label for="inputMultipleSaves" class="form-check-label small">Allow multiple saves</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputGrubLimit" class="form-check-input"/> <label for="inputGrubLimit" class="form-check-label small">Grub limitations</label></div></div></div><hr class="my-3"/><p class="medium fw-semibold mb-2" style="letter-spacing:.05em">Skips</p><div class="row row-cols-2 g-2 mb-4"><div class="col"><div class="form-check"><input type="checkbox" id="inputDarkrooms" class="form-check-input"/> <label for="inputDarkrooms" class="form-check-label small">Darkrooms</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputHardSkips" class="form-check-input"/> <label for="inputHardSkips" class="form-check-label small">Hard Skips</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputExtremeSkips" class="form-check-input"/> <label for="inputExtremeSkips" class="form-check-label small">Extreme Skips</label></div></div><div></div><a href="https://github.com/Teppi-txt/HKGalaxyGenerator/blob/main/skip_list.md" class="mb-2" style="color:#ebb945" ;>See skips in logic.</a></div><div class="d-grid"><button class="btn btn-primary" id="generateButton" type="button">Generate</button></div></form></div></div><div class="col-12 col-md-7"><div class="border rounded p-4 h-100 d-flex flex-column"><h5 class="mb-3">Board JSON</h5><pre class="bg-body-tertiary rounded p-3 flex-grow-1 mb-3" style="min-height:200px;font-size:.8rem"><code id="randomOrderOutput"></code></pre><div><button id="copyButton" class="btn btn-sm btn-outline-secondary" style="min-width:80px">Copy</button></div></div></div></div></div><footer class="text-center text-secondary pb-4" style="font-size:1rem"><a href="credits.html" class="me-2">Credits</a> <span id="versionDisplay" class="text-muted"></span></footer></body></html>
