<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HK custom galaxy generator</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><style>body.modal-open>:not(#boardModal){filter:blur(8px)}.board-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(90vw,1000px);margin:0 auto}.board-modal-dialog{max-width:700px}.board-modal-content{width:min(90vw,700px);aspect-ratio:1/1.1;margin:0 auto;display:flex;flex-direction:column}.board-modal-body{flex:1;overflow:auto;display:flex;justify-content:center;align-items:center}.board-cell{border:1px solid #475569;min-height:100px;padding:6px;font-size:1rem;font-weight:500;text-shadow:2px 2px 5px #2e2b2b;text-align:center;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);word-break:break-word;aspect-ratio:1/1}.board-cell.center{background:rgba(0,0,0,.25);border-color:#cf1111;font-weight:700}.title-p1{color:#ef4444}.title-p2{color:#3b82f6}.title-p3{color:#22c55e}.title-p4{color:#f59e0b}.tile-p1{background-color:#ef4444}.tile-p2{background-color:#3b82f6}.tile-p3{background-color:#22c55e}.tile-p4{background-color:#f59e0b}.btn-primary{background-color:#3b82f6;border-color:#3b82f6}.btn-accent{background-color:#f6a23b;border-color:#f6a23b}.btn-accent:hover{background-color:#d68d34;border-color:#d68d34}.btn-primary:hover{background-color:#2563eb;border-color:#2563eb}.btn-outline-secondary{color:#94a3b8;border-color:#94a3b8}.btn-outline-secondary:hover{background-color:#94a3b8;color:#0f172a}.form-check-input:checked{background-color:#3b82f6;border-color:#3b82f6}.bg-grub{position:fixed;opacity:.12;pointer-events:none;user-select:none;z-index:0}a{color:#60a5fa}a:hover{color:#93c5fd}.text-secondary{color:#e3e0e3!important}</style><link rel="icon" href="favicon.ico"><script defer="defer" src="main.bundle.js"></script></head><div class="modal fade" id="boardModal" tabindex="-1" aria-labelledby="boardModalLabel" aria-hidden="true"><div class="modal-dialog modal-dialog-centered board-modal-dialog"><div class="modal-content board-modal-content"><div class="modal-header"><h5 class="modal-title" id="boardModalLabel">Generated Board</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body board-modal-body"><div id="boardGrid" class="board-grid"></div></div></div></div></div><body><img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:90px;top:5%;left:5%;transform:rotate(-15deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:70px;top:20%;right:3%;transform:rotate(4deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:110px;top:50%;left:1%;transform:rotate(25deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:80px;bottom:25%;right:7%;transform:rotate(50deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:65px;bottom:8%;left:4%;transform:rotate(82deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:95px;top:92%;right:25%;transform:rotate(-8deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:75px;top:38%;left:12%;transform:rotate(60deg)"> <img src="89c6d5994394ed8aefef.png" class="bg-grub" style="width:85px;bottom:45%;right:1%;transform:rotate(-5deg)"><div class="container py-5" style="max-width:1200px"><h1 class="text-center mb-2"><span class="title-p1">HK </span><span class="title-p2">Galaxy </span><span class="title-p3">Gene</span><span class="title-p4">rator</span></h1><p class="text-center text-secondary" style="font-size:1.2rem">Create your HK galaxy boards &dash; made by <strong>Teppi</strong> and <strong>Ff300</strong>.<br>Make sure to check the <a href="credits.html">credits</a> :)</p><div class="row g-4 mt-1"><div class="col-12 col-md-5"><div class="border rounded p-4 h-100"><h5 class="mb-4">Settings</h5><form id="settingsForm"><div class="row g-3 mb-3"><div class="col-5"><label for="inputPlayerCount" class="form-label medium">Player count</label> <input type="number" id="inputPlayerCount" class="form-control form-control-m" value="4"/><div id="inputPlayerCountValidation" class="invalid-feedback d-none">Must be between 1 and 4.</div></div><div class="col-7"><label for="inputSeed" class="form-label medium">Seed</label> <input id="inputSeed" class="form-control form-control-m" aria-describedby="inputSeedHelp" value="Teppi fishes"/><div id="inputSeedHelp" class="form-text" style="font-size:1rem">Any random string or number.</div></div><div class="col-12"><label for="inputCenterSquare" class="form-label medium">Center square</label> <select class="form-select form-select-m" id="inputCenterSquare" aria-label="Center square"><option value="#Random" selected="selected">Random</option></select></div></div><hr class="my-3"/><p class="medium fw-semibold mb-2" style="letter-spacing:.05em">Options</p><div class="row row-cols-2 g-2 mb-3"><div class="col"><div class="form-check"><input type="checkbox" id="inputGeoLimit" class="form-check-input"/> <label for="inputGeoLimit" class="form-check-label small">Geo limitations</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputMajorAbility" class="form-check-input"/> <label for="inputMajorAbility" class="form-check-label small">Major ability chance</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputTollLimit" class="form-check-input"/> <label for="inputTollLimit" class="form-check-label small">Toll limitations</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputMultipleSaves" class="form-check-input"/> <label for="inputMultipleSaves" class="form-check-label small">Allow multiple saves</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputGrubLimit" class="form-check-input"/> <label for="inputGrubLimit" class="form-check-label small">Grub limitations</label></div></div></div><hr class="my-3"/><p class="medium fw-semibold mb-2" style="letter-spacing:.05em">Skips</p><div class="row row-cols-2 g-2 mb-4"><div class="col"><div class="form-check"><input type="checkbox" id="inputDarkrooms" class="form-check-input"/> <label for="inputDarkrooms" class="form-check-label small">Darkrooms</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputHardSkips" class="form-check-input"/> <label for="inputHardSkips" class="form-check-label small">Hard Skips</label></div></div><div class="col"><div class="form-check"><input type="checkbox" id="inputExtremeSkips" class="form-check-input"/> <label for="inputExtremeSkips" class="form-check-label small">Extreme Skips</label></div></div></div><div class="d-grid"><button class="btn btn-primary" id="generateButton" type="button">Generate</button></div></form></div></div><div class="col-12 col-md-7"><div class="border rounded p-4 h-100 d-flex flex-column"><h5 class="mb-3">Board JSON</h5><pre class="bg-body-tertiary rounded p-3 flex-grow-1 mb-3" style="min-height:200px;font-size:.8rem"><code id="randomOrderOutput"></code></pre><div><button id="copyButton" class="btn btn-sm btn-outline-secondary" style="min-width:80px">Copy</button> <button id="showBoardButton" class="btn btn-sm btn-primary ms-2" style="min-width:100px">Show Board</button></div></div></div></div></div><footer class="text-center text-secondary pb-4" style="font-size:1rem"><a href="credits.html" class="me-2">Credits</a> <span id="versionDisplay" class="text-muted"></span></footer></body></html>
