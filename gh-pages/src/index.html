<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HK custom galaxy generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script> -->
</head>

<body>
  <div class="container py-4 px-3 mx-auto">
    <h1 class="text-center mb-5">HK custom galaxy generator</h1>
    <p>
      Here you can create your HK galaxy boards.

      Made by Teppi and Ff300: make sure to check the <a href="credits.html" class="me-2">credits</a>!
    </p>
    <div class="row row-cols-2">
      <div class="col">
        <button class="btn btn-primary" id="generateButton">Generate</button>
        <!-- Form for settings -->
        <p class="mt-3 h4">Settings</p>
        <form id="settingsForm">

          <div class="mt-3">
            <label for="inputPlayerCount" class="form-label">Player count</label>
            <input type="number" id="inputPlayerCount" class="form-control" value="4" />
            <div id="inputPlayerCountValidation" class="invalid-feedback d-none">
              Player count must be between 1 and 4.
            </div>
          </div>

          <div class="row mt-1 g-3 align-items-center">
            <div class="col-auto">
              <label for="inputCenterSquare" class="col-form-label">Select center square:</label>
            </div>
            <div class="col-auto">
              <select class="form-select" id="inputCenterSquare" aria-label="Center square">
                <option value="#Random" selected>Random</option>
              </select>
            </div>
          </div>

          <div class="mt-3">
            <input type="checkbox" id="inputMajorAbility" class="form-check-input me-1" />
            <label for="inputMajorAbility" class="form-check-label">Increase major ability chance</label>
          </div>

          <div class="mt-3">
            <input type="checkbox" id="inputGeoLimit" class="form-check-input me-1" />
            <label for="inputGeoLimit" class="form-check-label">Force geo limitations</label>
          </div>

          <div class="mt-3">
            <input type="checkbox" id="inputMultipleSaves" class="form-check-input me-1" />
            <label for="inputMultipleSaves" class="form-check-label">Allow lines requiring multiple saves</label>
          </div>

          <p class="mt-3 h4">Skips</p>

          <div class="mt-3">
            <input type="checkbox" id="inputDarkrooms" class="form-check-input me-1" />
            <label for="inputDarkrooms" class="form-check-label">Darkrooms</label>
          </div>

          <div class="mt-3">
            <input type="checkbox" id="inputHardSkips" class="form-check-input me-1" />
            <label for="inputHardSkips" class="form-check-label">Hard Skips</label>
          </div>

          <div class="mt-3">
            <input type="checkbox" id="inputExtremeSkips" class="form-check-input me-1" />
            <label for="inputExtremeSkips" class="form-check-label">Extreme Skips</label>
          </div>

          <div class="mt-3">
            <label for="inputSeed" class="form-label">Seed</label>
            <input type="number" id="inputSeed" class="form-control" aria-describedby="inputSeedHelp" value="0" />
            <div id="inputSeedHelp" class="form-text">
              Randomization seed. Put a random number in here.
            </div>
          </div>
        </form>
      </div>
      <!-- Randomizer output -->
      <div class="col">
        <p class="h3">Galaxy board:</p>
        <button id="copyButton" class="btn btn-sm btn-outline-secondary">
          Copy
        </button>
        <pre class="bg-body-tertiary rounded p-3 mt-3"><code id="randomOrderOutput"></code></pre>
      </div>
    </div>
  </div>
  <footer class="mb-3">
    <div class="container">
      <a href="credits.html" class="me-2">Credits</a>
      <span id="versionDisplay" class="text-muted me-2"></span>
    </div>
  </footer>
</body>

</html>
