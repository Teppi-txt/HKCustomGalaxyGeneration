<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HK custom galaxy generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .title-p1 { color: #ef4444; }
    .title-p2 { color: #3b82f6; }
    .title-p3 { color: #22c55e; }
    .title-p4 { color: #f59e0b; }

    .btn-primary {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }
    .btn-primary:hover {
      background-color: #2563eb;
      border-color: #2563eb;
    }

    .btn-outline-secondary {
      color: #94a3b8;
      border-color: #94a3b8;
    }
    .btn-outline-secondary:hover {
      background-color: #94a3b8;
      color: #0f172a;
    }

    .form-check-input:checked {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    a { color: #60a5fa; }
    a:hover { color: #93c5fd; }

    .text-secondary { color: #e3e0e3 !important; }
  </style>
</head>

<body>
  <div class="container py-5" style="max-width: 1200px;">
    <h1 class="text-center mb-2">
      <span class="title-p1">HK </span><span class="title-p2">Galaxy </span><span class="title-p3">Gene</span><span class="title-p4">rator</span>
    </h1>
    <p class="text-center text-secondary" style="font-size: 1.2rem;">
      Create your HK galaxy boards &dash;
      made by <strong>Teppi</strong> and <strong>Ff300</strong>.
      <br>
      Make sure to check the
      <a href="credits.html">Credits</a>
      :)
    </p>

    <div class="row g-4 mt-1">
      <!-- Settings -->
      <div class="col-12 col-md-5">
        <div class="border rounded p-4 h-100">
          <h5 class="mb-4">Settings</h5>
          <form id="settingsForm">

            <div class="row g-3 mb-3">
              <div class="col-5">
                <label for="inputPlayerCount" class="form-label small">Player count</label>
                <input type="number" id="inputPlayerCount" class="form-control form-control-sm" value="4" />
                <div id="inputPlayerCountValidation" class="invalid-feedback d-none">
                  Must be between 1 and 4.
                </div>
              </div>
              <div class="col-7">
                <label for="inputSeed" class="form-label small">Seed</label>
                <input type="text" id="inputSeed" class="form-control form-control-sm" aria-describedby="inputSeedHelp" value="Teppi fishes" />
                <div id="inputSeedHelp" class="form-text" style="font-size: 0.7rem;">Any random string or number.</div>
              </div>
              <div class="col-12">
                <label for="inputCenterSquare" class="form-label small">Center square</label>
                <select class="form-select form-select-sm" id="inputCenterSquare" aria-label="Center square">
                  <option value="#Random" selected>Random</option>
                </select>
              </div>
            </div>

            <hr class="my-3" />

            <p class="medium fw-semibold mb-2" style="letter-spacing: .05em;">Options</p>
            <div class="row row-cols-2 g-2 mb-3">
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputGeoLimit" class="form-check-input" />
                  <label for="inputGeoLimit" class="form-check-label small">Geo limitations</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputMajorAbility" class="form-check-input" />
                  <label for="inputMajorAbility" class="form-check-label small">Major ability chance</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputTollLimit" class="form-check-input" />
                  <label for="inputTollLimit" class="form-check-label small">Toll limitations</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputMultipleSaves" class="form-check-input" />
                  <label for="inputMultipleSaves" class="form-check-label small">Multiple saves</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputGrubLimit" class="form-check-input" />
                  <label for="inputGrubLimit" class="form-check-label small">Grub limitations</label>
                </div>
              </div>
              
            </div>

            <hr class="my-3" />

            <p class="medium fw-semibold mb-2" style="letter-spacing: .05em;">Skips</p>
            <div class="row row-cols-2 g-2 mb-4">
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputDarkrooms" class="form-check-input" />
                  <label for="inputDarkrooms" class="form-check-label small">Darkrooms</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputHardSkips" class="form-check-input" />
                  <label for="inputHardSkips" class="form-check-label small">Hard Skips</label>
                </div>
              </div>
              <div class="col">
                <div class="form-check">
                  <input type="checkbox" id="inputExtremeSkips" class="form-check-input" />
                  <label for="inputExtremeSkips" class="form-check-label small">Extreme Skips</label>
                </div>
              </div>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary" id="generateButton" type="button">Generate</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Output -->
      <div class="col-12 col-md-7">
        <div class="border rounded p-4 h-100 d-flex flex-column">
          <h5 class="mb-3">Board JSON</h5>
          <pre class="bg-body-tertiary rounded p-3 flex-grow-1 mb-3" style="min-height: 200px; font-size: 0.8rem;"><code id="randomOrderOutput"></code></pre>
          <div>
            <button id="copyButton" class="btn btn-sm btn-outline-secondary" style="min-width: 80px;">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-secondary pb-4" style="font-size: 1rem;">
    <a href="credits.html" class="me-2">Credits</a>
    <span id="versionDisplay"></span>
  </footer>
</body>

</html>
